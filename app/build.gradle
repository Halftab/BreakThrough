plugins {
    id 'com.android.application'
}

android {
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    
    namespace 'com.halftab.breakthrough'
    compileSdk 36

    defaultConfig {
        applicationId 'com.halftab.breakthrough'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
