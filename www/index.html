</style></head><body><canvas aria-label="Break Through game" height="940" id="game" width="1672"></canvas>
<script>
(function(){'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const BASE_W=1672,BASE_H=940;
let W=BASE_W,H=BASE_H,FLOOR=695,CEILING=35;
let renderScale=1,renderDpr=1;
let safeInsets={left:0,right:0,top:0,bottom:0};
function updateSafeInsets(){
  const css=getComputedStyle(document.documentElement);
  const n=v=>{const x=parseFloat(v);return Number.isFinite(x)?Math.max(0,x):0};
  let left=n(css.getPropertyValue('--safe-left')),right=n(css.getPropertyValue('--safe-right')),top=n(css.getPropertyValue('--safe-top')),bottom=n(css.getPropertyValue('--safe-bottom'));
  try{
    if(window.BreakThroughInsets){
      left=Math.max(left,n(window.BreakThroughInsets.getLeft()));
      right=Math.max(right,n(window.BreakThroughInsets.getRight()));
      top=Math.max(top,n(window.BreakThroughInsets.getTop()));
      bottom=Math.max(bottom,n(window.BreakThroughInsets.getBottom()));
    }
  }catch(e){}
  safeInsets={left,right,top,bottom};
}
function safeXLeft(px){return px+safeInsets.left/renderScale}
function safeXRight(px){return W-px-safeInsets.right/renderScale}
function safeYBottom(px){return H-px-safeInsets.bottom/renderScale}
function resizeCanvas(){
  const cssW=Math.max(1,window.innerWidth),cssH=Math.max(1,window.innerHeight);
  const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  renderDpr=dpr;
  // The game uses a responsive world viewport: height remains in the original
  // game coordinate system while visible world width follows the real screen ratio.
  // This makes the gameplay viewport itself dynamic instead of letterboxing a fixed world.
  H=BASE_H;
  W=BASE_H*(cssW/cssH);
  FLOOR=BASE_H-245;
  CEILING=35;
  renderScale=cssH/H;
  updateSafeInsets();
  const pixelW=Math.max(1,Math.round(cssW*dpr)),pixelH=Math.max(1,Math.round(cssH*dpr));
  if(canvas.width!==pixelW||canvas.height!==pixelH){canvas.width=pixelW;canvas.height=pixelH;}
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
  ctx.imageSmoothingEnabled=true;
  ctx.setTransform(dpr*renderScale,0,0,dpr*renderScale,0,0);
}
window.addEventListener('resize',resizeCanvas,{passive:true});
window.addEventListener('orientationchange',resizeCanvas,{passive:true});

const WEATHER_SPAN=300,WEATHER_BLEND=180;
const WEATHER=[
  {sky:[197,231,248],building:[178,208,226],shrub:[158,191,174],ground:[1,1,1],shade:0},
  {sky:[211,211,218],building:[157,151,158],shrub:[137,149,139],ground:[1,.98,.98],shade:.025},
  {sky:[49,64,84],building:[91,99,111],shrub:[78,94,87],ground:[.72,.76,.82],shade:.12}
];
function clamp01(v){return v<0?0:v>1?1:v}
function smoothstep(v){v=clamp01(v);return v*v*v*(v*(v*6-15)+10)}
function weatherState(){
  const d=Math.max(0,distance);
  const index=Math.floor(d/WEATHER_SPAN);
  if(index===0)return {from:0,to:0,t:0};
  const boundary=index*WEATHER_SPAN;
  const delta=d-boundary;
  const from=(index-1)%3;
  const to=index%3;
  const t=smoothstep((delta+WEATHER_BLEND/2)/WEATHER_BLEND);
  return {from,to,t};
} function weatherColor(a,b,t){return Math.round(a+(b-a)*t)}
function weatherRGB(a,b,t){return 'rgb('+weatherColor(a[0],b[0],t)+','+weatherColor(a[1],b[1],t)+','+weatherColor(a[2],b[2],t)+')'}
function weatherGroundTint(t){
  const s=weatherState(),a=WEATHER[s.from].ground,b=WEATHER[s.to].ground;
  return [a[0]+(b[0]-a[0])*s.t*t,a[1]+(b[1]-a[1])*s.t*t,a[2]+(b[2]-a[2])*s.t*t];
}

  for(const c of cracks){ctx.beginPath();ctx.moveTo(crackX+c[0],splitY+c[1]);ctx.lineTo(crackX+c[2],splitY+c[3]);ctx.lineTo(crackX+c[4],splitY+c[5]);ctx.stroke()}

  // Larger angular shards, kept restrained to match the game's aesthetic.
  ctx.globalAlpha=.9;ctx.fillStyle='#6faebd';
  const phase=time*.0014;
  const shards=[[-62,-23,6,1.2],[-49,20,6,4.2],[-31,-31,5,2.4],[31,30,6,5.1],[49,-22,6,1.1],[64,18,5,3.7],[-78,2,5,5.8],[78,-4,6,2.9],[-22,34,4,1.8],[22,-35,4,4.8]];
  for(const sh of shards){
    const sx=crackX+sh[0]+Math.cos(phase+sh[2])*2.5, sy=splitY+sh[1]+Math.sin(phase*.85+sh[2])*3;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(phase*.35+sh[2]);ctx.beginPath();ctx.moveTo(-sh[3],-2.5);ctx.lineTo(sh[3]+3,0);ctx.lineTo(0,5);ctx.closePath();ctx.fill();ctx.restore();
  }

  // Short bullet streaks entering and leaving the title.
  ctx.globalAlpha=.72;ctx.strokeStyle='#ffffff';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(throughX-42,splitY);ctx.lineTo(crackX-12,splitY);ctx.moveTo(crackX+12,splitY);ctx.lineTo(throughX+throughW+43,splitY);ctx.stroke();
  ctx.restore();
  ctx.textAlign='left';
}

function drawHomeScreen(time){
  const b=homeButtonRects();
  const box={x:W*.11,y:H*.09,w:W*.78,h:H*.82};
  const centerX=W/2;

  // Symmetrical mobile title screen: one centered composition, with Guy anchoring the lower half.
  ctx.fillStyle='rgba(199,232,248,.72)';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(241,243,239,.94)';
  ctx.beginPath();
  ctx.roundRect(box.x,box.y,box.w,box.h,30);
  ctx.fill();

  ctx.strokeStyle='rgba(126,169,149,.28)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect(box.x+14,box.y+14,box.w-28,box.h-28,24);
  ctx.stroke();

  // Large centered title.
  ctx.save();
  drawHomeTitle(time);
  ctx.restore();

  // Centered primary action.
  ctx.textAlign='center';
  ctx.fillStyle='#d8f0df';
  ctx.strokeStyle='#8fbea0';
  ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.roundRect(b.start.x,b.start.y,b.start.w,b.start.h,18);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle='#254337';
  ctx.font='700 34px "Trebuchet MS",Arial,sans-serif';
  ctx.fillText('START',centerX,b.start.y+55);

  // Centered secondary action.
  ctx.fillStyle='#e8f0f2';
  ctx.strokeStyle='#c4d3d8';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect(b.option.x,b.option.y,b.option.w,b.option.h,17);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle='#516673';
  ctx.font='600 25px "Trebuchet MS",Arial,sans-serif';
  ctx.fillText('OPTIONS',centerX,b.option.y+46);

  // Floating Guy: bounce wall-to-wall across the title panel.
  // One left-to-right trip takes 12 seconds; the return trip takes another 12.
  const wallInset=70;
  const travelStart=box.x+wallInset;
  const travelEnd=box.x+box.w-wallInset;
  const bouncePhase=(time/12000)%2;
  const bounceT=bouncePhase<1?bouncePhase:2-bouncePhase;
  const guyX=travelStart+(travelEnd-travelStart)*bounceT;
  const guyY=H*.755+Math.sin(time*.0018)*7;
  const oldX=player.x,oldY=player.y;
  const homePreviewBase=guyY;
  player.x=guyX;
  player.y=homePreviewBase-PLAYER_FOOT_OFFSET;
  homePreview=true;

  // Dynamic shadow: it gets smaller and lighter as Guy rises.
  const homeGroundY=box.y+box.h*.91;
  const homeLift=Math.max(0,homeGroundY-guyY);
  const shadowLift=Math.min(1,homeLift/150);
  const shadowW=54-25*shadowLift;
  const shadowH=8-3*shadowLift;
  const shadowAlpha=.20-.08*shadowLift;
  ctx.save();
  ctx.globalAlpha=shadowAlpha;
  ctx.fillStyle='#41535d';
  ctx.beginPath();
  ctx.ellipse(guyX,homeGroundY,shadowW,shadowH,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha=.98;
  ctx.translate(guyX,0);
  const facingRight=bouncePhase<1;
  ctx.scale(facingRight?1:-1,1);
  ctx.translate(-guyX,0);
  // Scale the complete character as one unit while preserving his existing drawing.
  ctx.translate(guyX,guyY);
  ctx.scale(1.215,1.215);
  ctx.translate(-guyX,-guyY);
  drawHoverboard();
  // Home-screen thrusters are always active, matching the in-game flame animation.
  const homeBx=guyX-BOARD_WIDTH/2-5;
  const homeBaseY=guyY+PLAYER_FOOT_OFFSET+BOARD_HEIGHT*.68;
  drawHomeThrusterSmoke(time,homeBx+BOARD_WIDTH*.20,homeBaseY,0);
  drawHomeThrusterSmoke(time,homeBx+BOARD_WIDTH*.80,homeBaseY,1);
  drawHoverboardThrust(time,true);
  drawStickman();
  ctx.restore();

  player.x=oldX;
  player.y=oldY;
  homePreview=false;

  // Information button in the bottom-right corner of the home screen.
  ctx.fillStyle='#e8f0f2';
  ctx.strokeStyle='#c4d3d8';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(b.info.x,b.info.y,b.info.w,b.info.h,16);ctx.fill();ctx.stroke();
  ctx.fillStyle='#516673';
  ctx.font='700 21px "Trebuchet MS",Arial,sans-serif';
  ctx.textAlign='center';
  ctx.font='700 36px Arial,sans-serif';
  ctx.fillText('i',b.info.x+b.info.w/2,b.info.y+45);
  ctx.textAlign='left';
}
function drawOptions(){const r=optionsRects();ctx.fillStyle='rgba(199,232,248,.96)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#203544';ctx.font='700 52px "Trebuchet MS",Arial,sans-serif';ctx.fillText('OPTIONS',W/2,245);ctx.textAlign='left';ctx.fillStyle='#304957';ctx.font='600 25px "Trebuchet MS",Arial,sans-serif';ctx.fillText('Music',W/2-250,345);ctx.fillText(Math.round(musicVolume*100)+'%',W/2+190,345);ctx.fillText('Sound Effects',W/2-250,470);ctx.fillText(Math.round(gameVolume*100)+'%',W/2+190,470);for(const key of ['music','game']){const q=r[key],v=key==='music'?musicVolume:gameVolume;ctx.fillStyle='#d8e6eb';ctx.beginPath();ctx.roundRect(q.x,q.y,q.w,q.h,9);ctx.fill();ctx.fillStyle='#9bc5b0';ctx.beginPath();ctx.roundRect(q.x,q.y,q.w*v,q.h,9);ctx.fill();ctx.fillStyle='#ffffff';ctx.strokeStyle='#7ea995';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x+q.w*v,q.y+q.h/2,13,0,Math.PI*2);ctx.fill();ctx.stroke();}ctx.textAlign='left';ctx.fillStyle='#e8f0f2';ctx.strokeStyle='#c4d3d8';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(r.controls.x,r.controls.y,r.controls.w,r.controls.h,15);ctx.fill();ctx.stroke();ctx.textAlign='left';ctx.fillStyle='#304957';ctx.font='600 20px "Trebuchet MS",Arial,sans-serif';ctx.fillText('Touch Controls',r.controls.x+18,r.controls.y+25);ctx.font='16px Arial';ctx.fillStyle='#516673';ctx.fillText(invertControls?'LEFT: SHOOT   •   RIGHT: JUMP':'LEFT: JUMP   •   RIGHT: SHOOT',r.controls.x+18,r.controls.y+47);ctx.textAlign='right';ctx.font='700 16px Arial';ctx.fillStyle='#254337';ctx.fillText('TAP TO INVERT',r.controls.x+r.controls.w-18,r.controls.y+34);ctx.textAlign='center';ctx.fillStyle='#d8f0df';ctx.strokeStyle='#a9cfb4';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(r.back.x,r.back.y,r.back.w,r.back.h,15);ctx.fill();ctx.stroke();ctx.fillStyle='#254337';ctx.font='700 23px "Trebuchet MS",Arial,sans-serif';ctx.fillText('BACK',W/2,r.back.y+36);ctx.textAlign='left'}
function drawOverlay(time){

  if(dead){
    ctx.fillStyle='rgba(245,218,218,.88)';ctx.fillRect(0,0,W,H);

    ctx.font='22px Arial';ctx.fillText('Press anywhere to restart',W/2,525);

function draw(time){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const ws=weatherState(),wa=WEATHER[ws.from],wb=WEATHER[ws.to];
  ctx.fillStyle=weatherRGB(wa.sky,wb.sky,ws.t);
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(renderDpr*renderScale,0,0,renderDpr*renderScale,0,0);
  drawEnvironment();
  for(let i=0;i<walls.length;i++)drawWall(walls[i]);
  drawPowerup(powerup,time);
  drawGlassBreaks();
  drawHoverboard();
  drawHoverboardThrust(time);
  drawBullets();
  drawStickman();
  if(started&&!dead){drawHUD();drawPowerupHUD();}
  drawOverlay(time)
}
function loop(t){if(!lastTime)lastTime=t;let dt=(t-lastTime)/16.6667;if(dt>2)dt=2;lastTime=t;update(dt);draw(t);requestAnimationFrame(loop)}

// Native Android integration: long-press haptics are disabled in MainActivity;

try{initAudio();if(audioCtx){const resumePromise=audioCtx.resume();if(resumePromise&&typeof resumePromise.catch==='function')resumePromise.catch(()=>{});startMusic()}}catch(e){}
